name: Build Tap Chase APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Tap Chase
        run: |
          unzip -o "Tap Chase.zip" -d project
          find project -type f -name "main.py" -exec cp {} project/main.py \;

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev

      - name: Install Python tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Create buildozer.spec
        working-directory: project
        run: |
          buildozer init

          python3 - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text()

          replacements = {
              "title = My Application": "title = Tap Chase",
              "package.name = myapp": "package.name = tapchase",
              "package.domain = org.test": "package.domain = org.tapchase",
              "source.include_exts = py,png,jpg,kv,atlas": "source.include_exts = py,png,jpg,jpeg,kv,atlas,mp3,wav,ogg,json,ttf",
              "requirements = python3,kivy": "requirements = python3,kivy",
              "orientation = portrait": "orientation = portrait",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          p.write_text(text)
          PY

      - name: Build APK
        working-directory: project
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tap-chase-apk
          path: project/bin/*.apk
